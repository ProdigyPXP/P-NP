name: BetterDependabot

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Precondition lockfile
        run: pnpm install --no-frozen-lockfile --ignore-scripts

      - name: Update root dependencies
        # No --latest: stay within the semver ranges declared in package.json
        # (caret ranges) so this unattended, directly-pushed-to-master job can
        # never silently cross a major version (e.g. the typescript v6->v7
        # jump that landed with no PR/CI gate). Major bumps should go through
        # Dependabot's PR flow, which is gated by Build Check + Dependency Review.
        run: pnpm update --ignore-scripts

      - name: Commit changes
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add .
          git commit -m "chore: update dependencies" || exit 0
          git push
