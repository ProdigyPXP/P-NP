name: Patch Prodigy Files

on:
  # Cron disabled: runtime patching moved client-side. The Play Origin extension
  # now patches the bundle in-browser from the user's residential connection, so
  # the server-side run is no longer needed for runtime — and it was 403-blocked
  # on GitHub's Azure IPs anyway. Kept as manual-only to regenerate
  # dist/manifest.json after editing patch rules. See CLAUDE.md.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: patch-workflow
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - name: Checkout source branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.9
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build patcher
        run: pnpm build

      - name: Generate patched files
        id: patch
        timeout-minutes: 10
        run: pnpm run patch ./dist

      - name: Commit patched files to master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

          git add dist/manifest.json dist/game.min.js dist/metadata.json
          git add dist/public-game.min.js 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No patch changes to commit"
            exit 0
          fi

          git commit -m "chore: update patched game files"
          git pull --rebase origin master
          git push origin master
